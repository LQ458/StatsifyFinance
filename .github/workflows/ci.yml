name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/statsify_ci
      AUTH_SECRET: ci-only-auth-secret
      NEXTAUTH_URL: http://localhost:8810
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Clean install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Production dependency audit
        run: pnpm audit:prod

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
